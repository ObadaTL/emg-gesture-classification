[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-classifier"
version = "1.0.0"
description = "EMG hand-gesture classification framework for the UCI EMG dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Obada" }]
dependencies = [
    "numpy>=1.26.0,<2.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "imbalanced-learn>=0.12.0",
    "tensorflow>=2.15.0",
    "keras-tuner>=1.4.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0",
    "tqdm>=4.67.0",
    "statsmodels>=0.14.0",
    "joblib>=1.4.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emg_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
