test_mode: false

# Default experiment settings (used when test_mode is false)
data:
  # Channel subsets from the paper's table XI
  channel_configs: 
    - {count: 4, channels: [1, 3, 5, 7]}
    - {count: 5, channels: [1, 3, 4, 5, 8]}
    - {count: 6, channels: [3, 4, 5, 6, 7, 8]}
    - {count: 7, channels: [1, 2, 3, 4, 6, 7, 8]}
    - {count: 8, channels: [1, 2, 3, 4, 5, 6, 7, 8]}
  segment_dims: [256, 512, 1024, 2048]  # All window sizes to try
  increment_dims: [64, 128, 256, 512]    # Corresponding increment sizes
  #feature_dim: 104
  users: 36
  chunk_size: 10000
  n_workers: 4
  validation_split: 0.2
  test_split: 0.2
  random_seed: 42
  class_labels: {
    0: "unmarked",
    1: "rest",
    2: "fist",
    3: "wrist_flexion",
    4: "wrist_extension",
    5: "radial_deviation",
    6: "ulnar_deviation",
    7: "extended_palm"
  }

# Test mode settings (used when test_mode is true)
test_settings:
  channel_no: 8
  channel_subset: [1, 2, 3, 4, 5, 6, 7, 8]  # All channels for testing
  segment_dim: 2048
  increment_dim: 512
  feature_dim: 104  # channel_no * 13 (13 features per channel)

model:
  types: ["sklearn", "tensorflow"]  # All model types to be tested
  test_type: "tensorflow"  # Only this model will be used in test mode
  optimize_hyperparameters: false
  architecture:
    layers: 2
    units: [72, 30]
    dropout_rates: [0.4, 0.0]
  learning_rate: 0.002988538699229984
  batch_size: 64
  epochs: 300
  optimizer:
    type: "adam"
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1e-07

# Ensemble settings
ensemble:
  type: "voting"  # Options: "stacking", "voting"
  meta_learner: "logistic_regression"  # Meta-learner for stacking

paths:
  raw_data: "data/raw/UCI"
  processed_data: "data/processed/UCI"
  interim_data: "data/interim/UCI"
  experiments: "experiments"
  results: "results"

processing:
  n_jobs: 10  # Use all available CPU cores (-1) or specify a number 
  use_lda: false  # Set to true to enable LDA dimensionality reduction
  lda_components: 4  # Number of LDA components (should be <= num_classes-1)